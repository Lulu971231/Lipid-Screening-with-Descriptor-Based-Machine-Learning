[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lnp-screen"
version = "1.0.0"
description = "Descriptor-based machine learning for virtual lipid nanoparticle screening"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "imbalanced-learn>=0.11.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "padelpy>=0.1.13",
    "scikit-optimize>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lnp_screen*"]
